---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {% if page.authors %}
  <div class="authors">
    {% for a in page.authors %}
    <div class="author"><span class="author-name">{{ a.name }}</span>{% if a.affiliation %} <span class="affiliation">{{ a.affiliation }}</span>{% endif %}</div>
    {% endfor %}
  </div>
  {% endif %}
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {{ content }}
</article>
